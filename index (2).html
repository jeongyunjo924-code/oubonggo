<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우봉고 교실 · 조각 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E3550;
    --bg-2: #2B4C72;
    --bg-3: #152A41;
    --paper: #EEF5FB;
    --ink: #14213D;
    --sun: #FFC53D;
    --text: #F4F7FB;
    --muted: #A9BCD0;
    --good: #51CF66;
    --warn: #FF6B6B;
    --top: clamp(64px, 10vh, 118px);
    --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    --body: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
    font-size: clamp(14px, 0.95vw + 0.25vh, 30px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--body);
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0 / 22px 22px,
      var(--bg);
  }

  /* ---------- 상단 바 ---------- */
  #topbar {
    height: var(--top); flex: none;
    display: flex; align-items: center; gap: 1.1rem;
    padding: 0 1rem 0 1.4rem;
    background: var(--bg-3);
    border-bottom: 4px solid #0E1D2E;
  }
  .brand { font-family: var(--display); font-size: 1.7rem; display: flex; align-items: center; gap: .55rem; white-space: nowrap; }
  .brand-mark { width: 1.6em; height: 1.6em; }
  #turnInfo { display: flex; flex-direction: column; gap: .15rem; white-space: nowrap; }
  #roundLabel { font-size: .9rem; color: var(--muted); }
  #turnLabel { font-family: var(--display); font-size: 1.5rem; color: var(--sun); }
  #scoreboard {
    flex: 1; min-width: 0; display: flex; gap: .5rem; align-items: center;
    overflow-x: auto; padding: .3rem .2rem; scrollbar-width: none;
  }
  #scoreboard::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: flex; align-items: baseline; gap: .5rem;
    border: none; border-radius: 999px; padding: .35rem 1rem;
    background: var(--bg-2); font-family: var(--display); font-size: 1.1rem;
  }
  .chip b { font-size: 1.5rem; font-weight: normal; }
  .chip.cur { background: var(--sun); color: var(--ink); }
  #timerBox { width: 8.5rem; flex: none; text-align: center; }
  #timerText { font-family: var(--display); font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; }
  #timerBar { height: .5rem; border-radius: 99px; background: rgba(255,255,255,.12); margin-top: .35rem; overflow: hidden; }
  #timerBar i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 99px; transition: width .2s linear, background .3s; }
  #timerBox.low #timerText { color: var(--warn); animation: throb 1s infinite; }
  #timerBox.low #timerBar i { background: var(--warn); }
  @keyframes throb { 50% { transform: scale(1.08); } }

  #dice {
    position: relative; flex: none;
    height: calc(var(--top) - 16px); aspect-ratio: 1;
    border: none; border-radius: 24%; padding: 0;
    background: #FFFFFF;
    box-shadow: inset 0 -7px 0 #CAD6E4, inset 0 3px 0 #fff, 0 5px 0 #0B1624;
    display: grid; place-items: center;
  }
  #dieFace { width: 72%; height: 72%; display: grid; place-items: center; }
  #dieFace svg { width: 100%; height: 100%; }
  #dieFace .q { font-family: var(--display); font-size: calc(var(--top) * .5); color: var(--ink); }
  #dice.ready::after {
    content: ''; position: absolute; inset: -6px; border-radius: 28%;
    border: 4px solid var(--sun); animation: ring 1.4s ease-out infinite;
  }
  @keyframes ring { from { opacity: 1; transform: scale(.95); } to { opacity: 0; transform: scale(1.25); } }
  #dice.rolling { animation: tumble .9s ease-in-out; }
  @keyframes tumble {
    0% { transform: rotate(0) translateY(0); }
    20% { transform: rotate(-28deg) translateY(-14%); }
    45% { transform: rotate(22deg) translateY(4%); }
    70% { transform: rotate(-12deg) translateY(-6%); }
    100% { transform: rotate(0) translateY(0); }
  }
  #dice.nope { animation: nope .35s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .dice-label { font-size: .8rem; color: var(--muted); text-align: center; margin-top: .2rem; }
  .dice-wrap { flex: none; display: flex; flex-direction: column; align-items: center; }

  /* ---------- 본문 ---------- */
  #main { flex: 1; min-height: 0; display: flex; gap: 1rem; padding: 1rem; }
  #boardPanel { flex: 1.3; min-width: 0; display: flex; flex-direction: column; }
  #trayPanel {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--bg-3); border-radius: 22px; padding: .9rem 1rem 1rem;
    box-shadow: inset 0 4px 14px rgba(0,0,0,.35);
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; min-height: 2.6rem; }
  .panel-head h2 { margin: 0; font-family: var(--display); font-weight: normal; font-size: 1.6rem; }
  #faceInfo { display: flex; align-items: center; gap: .5rem; font-size: 1.15rem; color: var(--muted); }
  #faceInfo svg { width: 1.9rem; height: 1.9rem; }
  #faceInfo.go { color: var(--text); }
  .hint { font-size: .95rem; color: var(--muted); }
  #boardArea, #trayArea { flex: 1; min-height: 0; position: relative; }
  #boardSvg { position: absolute; overflow: visible; filter: drop-shadow(0 10px 0 rgba(8,18,30,.45)); }
  #boardSvg.solved .edge { stroke: #2B8A3E; }
  .slot { position: absolute; border-radius: 16px; border: 2px dashed rgba(255,255,255,.07); transition: border-color .4s, background .4s; }
  .slot.on { border: 3px solid rgba(255,197,61,.6); background: rgba(255,197,61,.07); }

  #controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding-top: .6rem; }
  .btn {
    border: none; border-radius: 14px; min-height: 3.1rem; padding: .45rem .95rem;
    background: var(--bg-2); font-family: var(--display); font-size: 1.08rem; white-space: nowrap;
    box-shadow: 0 5px 0 #0E1D2E; transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #0E1D2E; }
  .btn.primary { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 #B07F12; }
  .btn.armed { background: var(--warn); color: #fff; }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .seg { display: inline-flex; background: #0E1D2E; border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { border: none; background: transparent; border-radius: 10px; padding: .4rem .85rem; min-height: 2.6rem; font-family: var(--display); font-size: 1.08rem; white-space: nowrap; color: var(--muted); }
  .seg button.on { background: var(--paper); color: var(--ink); }
  .spacer { flex: 1; }

  /* ---------- 조각 ---------- */
  #pieceLayer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .piece { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; transition: filter .45s, opacity .45s; }
  .piece.anim { transition: transform .3s cubic-bezier(.2,.9,.25,1), filter .45s, opacity .45s; }
  .piece.anim-fast { transition: transform .12s ease-out, filter .45s, opacity .45s; }
  .piece svg.thunk { animation: thunk .34s cubic-bezier(.3,1.5,.5,1); }
  @keyframes thunk { 0% { transform: scale(1.12); filter: brightness(1.45); } 45% { transform: scale(.94); } 100% { transform: none; } }
  #boardSvg .ghost { fill: none; stroke-width: .12; stroke-linecap: square; }
  #boardSvg .ghost.ok { stroke: #2FB344; }
  #boardSvg .ghost.no { stroke: #FF6B6B; stroke-dasharray: .18 .12; }
  .piece-inner { pointer-events: none; transition: transform .16s ease-out; }
  .piece svg { display: block; overflow: visible; transform-origin: 50% 50%; }
  .piece rect, .piece .hit { pointer-events: auto; }
  .piece.inactive { filter: blur(5px) grayscale(.7); opacity: .32; }
  .piece.inactive rect, .piece.locked rect, .piece.inactive .hit, .piece.locked .hit { pointer-events: none; }
  .piece.active svg { filter: drop-shadow(0 0 .45rem rgba(255,197,61,.95)) drop-shadow(0 5px 6px rgba(0,0,0,.4)); }
  .piece.dragging svg { filter: drop-shadow(0 16px 14px rgba(0,0,0,.5)); }
  .piece svg.spin { animation: spin .22s ease-out; }
  .piece svg.flip { animation: flipx .26s ease-out; }
  @keyframes spin { from { transform: rotate(-90deg); } to { transform: none; } }
  @keyframes flipx { from { transform: scaleX(-1); } to { transform: none; } }
  .flip-btn {
    position: absolute; left: 0; top: 0; display: none; pointer-events: auto;
    width: 3rem; height: 3rem; border-radius: 50%; padding: 0;
    background: var(--sun); border: 3px solid var(--ink); color: var(--ink);
    place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.35);
  }
  .flip-btn svg { width: 64%; height: 64%; }
  .piece.selected.active:not(.dragging) .flip-btn { display: grid; }

  /* ---------- 창 ---------- */
  #modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(9,19,32,.55); }
  #modal[hidden] { display: none; }
  #modalCard {
    width: min(92vw, 34rem); max-height: 90vh; overflow: auto; touch-action: pan-y;
    background: var(--paper); color: var(--ink); border-radius: 26px; padding: 1.8rem 2rem;
    border: 5px solid var(--ink); box-shadow: 0 12px 0 rgba(0,0,0,.35);
    animation: pop .28s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  #modalCard h3 { font-family: var(--display); font-weight: normal; font-size: 2.3rem; margin: 0 0 .4rem; }
  #modalCard h4 { font-family: var(--display); font-weight: normal; font-size: 1.3rem; margin: 1.2rem 0 .5rem; }
  #modalCard p { font-size: 1.2rem; line-height: 1.55; margin: 0 0 1.2rem; }
  #modalCard .btn { color: var(--text); }
  #modalCard .btn.primary { color: var(--ink); }
  .actions { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: flex-end; margin-top: 1.2rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .45rem 0; font-size: 1.15rem; }
  .row .seg button { color: #6B7F96; }
  .row .seg { background: #D5E1EC; }
  .row .seg button.on { background: var(--ink); color: #fff; }
  .stepper { display: inline-flex; align-items: center; gap: .6rem; }
  .stepper button { width: 2.8rem; height: 2.8rem; border-radius: 12px; border: none; background: var(--ink); color: #fff; font-size: 1.4rem; }
  .stepper b { font-family: var(--display); font-weight: normal; font-size: 1.6rem; min-width: 2.2rem; text-align: center; }
  .note { font-size: .95rem; color: #5A6E86; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

  /* ---------- 세로 화면 ---------- */
  /* 좁은 화면에서도 문제는 왼쪽, 조각은 오른쪽을 유지 */
  #app.portrait .brand span, #app.portrait .hint { display: none; }
  #app.portrait #main { gap: .6rem; padding: .6rem; }
  #app.portrait #trayPanel { padding: .6rem; }
  #app.portrait #faceInfo span { font-size: .95rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 3 3" aria-hidden="true">
        <rect x="0" y="0" width="2" height="1" fill="#FF6B6B"/><rect x="2" y="0" width="1" height="2" fill="#339AF0"/>
        <rect x="0" y="1" width="1" height="2" fill="#FCC419"/><rect x="1" y="1" width="1" height="1" fill="#40C057"/>
        <rect x="1" y="2" width="2" height="1" fill="#845EF7"/>
      </svg>
      <span>우봉고 교실</span>
    </div>
    <div id="turnInfo"><span id="roundLabel">1라운드</span><span id="turnLabel">1모둠 차례</span></div>
    <div id="scoreboard" aria-label="모둠 점수"></div>
    <div id="timerBox"><div id="timerText">1:30</div><div id="timerBar"><i></i></div></div>
    <div class="dice-wrap">
      <button id="dice" aria-label="주사위 굴리기"><div id="dieFace"><span class="q">?</span></div></button>
    </div>
  </header>

  <main id="main">
    <section id="boardPanel">
      <div class="panel-head">
        <h2 id="cardTitle">문제 카드 1</h2>
        <div id="faceInfo">주사위를 굴려서 쓸 조각을 정하세요</div>
      </div>
      <div id="boardArea"><svg id="boardSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="controls">
        <div class="seg" id="levelSeg" role="group" aria-label="난이도">
          <button data-level="3">3조각</button><button data-level="4">4조각</button>
        </div>
        <button class="btn" id="btnNew">새 카드</button>
        <button class="btn" id="btnReset">조각 되돌리기</button>
        <button class="btn" id="btnAnswer">정답 보기</button>
        <span class="spacer"></span>
        <button class="btn" id="btnSettings">설정</button>
        <button class="btn primary" id="btnNext">다음 모둠</button>
      </div>
    </section>

    <section id="trayPanel">
      <div class="panel-head">
        <h2>조각 상자</h2>
        <div class="hint">터치하면 돌리고, 밀면 옮겨요. 노란 버튼은 뒤집기예요.</div>
      </div>
      <div id="trayArea"></div>
    </section>
  </main>

  <div id="pieceLayer"></div>
  <canvas id="fx"></canvas>
  <div id="modal" hidden><div id="modalCard" role="dialog" aria-modal="true"></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
